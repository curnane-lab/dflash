# DFlash speculative decoding draft model training for Qwen3.5-4B on Ascend NPU
# Usage:
#   accelerate launch \
#       --config_file examples/accelerate/fsdp2_config_qwen35.yaml \
#       src/train.py examples/train_dflash/qwen3_5_dflash_sft_npu.yaml
#
# Note: Change `num_processes` in fsdp2_config_qwen35.yaml to match your NPU count

### model
model_name_or_path: /home/f00538480/Qwen3.5-4B/
trust_remote_code: true
use_v1_kernels: true
flash_attn: fa2

### method
stage: dflash
do_train: true
finetuning_type: full

### dflash
dflash_block_size: 16
dflash_num_draft_layers: 5
dflash_num_anchors: 256
dflash_loss_decay_gamma: 7.0
dflash_attention_backend: sdpa
# Optional: warm-start from a pretrained DFlash draft model checkpoint (e.g., z-lab/Qwen3.5-4B-DFlash)
dflash_pretrained_model_path: /home/f00538480/Qwen3.5-4B-DFlash/

### dataset
dataset: open_perfectblend
template: qwen3_5_nothink
cutoff_len: 3072
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/Qwen3.5-4B/dflash/sft
logging_steps: 10
save_steps: 5000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 6.0e-4
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_ratio: 0.04
bf16: true
ddp_timeout: 1800
resume_from_checkpoint: null
max_grad_norm: 0.5

### eval
